name: Verify public site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check offline recovery
        run: node tests/recovery-smoke.mjs
      - name: Check local links
        run: node tests/site-links-smoke.mjs
      - name: Audit public files and language pairs
        run: node tests/public-surface-audit.mjs
      - name: Verify download checksums
        working-directory: downloads
        run: sha256sum --check SHA256SUMS.txt
